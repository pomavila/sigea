<!DOCTYPE html>
<!--
  SIGEA - Sistema de Gestión de Estacionamiento y Abonados
  UNICENTRO CAJAMARCA S.A.C. (Huancayo)
  Sprint 1 · HU-02 · Tarea T08
  Pantalla: Inicio de sesión
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGEA · Iniciar sesión</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231F3864'/%3E%3Ctext x='8' y='12' font-size='10' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>

  <main class="sigea-login">
    <div class="card shadow-lg">
      <div class="card-body p-4 p-sm-5">

        <div class="text-center mb-4">
          <div class="sigea-logo mb-3"><i class="bi bi-p-square-fill" aria-hidden="true"></i></div>
          <h1 class="h4 sigea-titulo mb-1">SIGEA</h1>
          <p class="text-muted small mb-0">UNICENTRO CAJAMARCA S.A.C.</p>
        </div>

        <!-- Mensajes: sesión expirada o usuario/contraseña incorrectos -->
        <div id="alerta" class="alert d-none" role="alert"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario"
                   autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required>
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control" id="contrasena" name="contrasena"
                     autocomplete="current-password" maxlength="72" required>
              <button type="button" class="btn btn-outline-secondary" id="btnVer"
                      aria-label="Mostrar contraseña" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-sigea w-100 py-2" id="btnIngresar">
            <span class="spinner-border spinner-border-sm me-1 d-none" id="spinner" aria-hidden="true"></span>
            <span id="textoIngresar">Ingresar</span>
          </button>
        </form>

      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/sigea.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
