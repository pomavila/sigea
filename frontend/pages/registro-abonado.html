<!DOCTYPE html>
<!--
  SIGEA - Sistema de Gestión de Estacionamiento
  UNICENTRO CAJAMARCA S.A.C. (Huancayo)
  Sprint 1 · HU-01 Registro de abonados · Tarea T03
  Pantalla: Registro de abonado y contrato (con validaciones en el navegador)
-->
<html lang="es">
<head>
  <!-- 1. Metadatos básicos -->
  <meta charset="UTF-8">
  <!-- viewport: indispensable para que la página sea responsive en celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGEA · Registro de abonado</title>

  <!-- 2. Bootstrap 5 (CSS) y Bootstrap Icons desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- 3. Nuestros estilos (van DESPUÉS de Bootstrap para poder sobrescribirlo) -->
  <link href="../css/registro-abonado.css" rel="stylesheet">
</head>
<body>

  <!-- ============ BARRA SUPERIOR ============ -->
  <nav class="navbar navbar-dark sigea-navbar">
    <div class="container">
      <span class="navbar-brand fw-semibold">
        <i class="bi bi-p-square-fill me-2"></i>SIGEA
      </span>
      <span class="navbar-text small text-white-50 d-none d-sm-inline">
        UNICENTRO CAJAMARCA S.A.C.
      </span>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Título de la pantalla -->
    <header class="mb-4">
      <h1 class="h3 sigea-titulo mb-1">Registro de abonado y contrato</h1>
      <p class="text-muted mb-0">Los campos marcados con <span class="text-danger">*</span> son obligatorios.</p>
    </header>

    <!-- Zona para alertas de error general (por ejemplo, si la API falla) -->
    <div id="alertaGeneral" class="alert alert-danger d-none" role="alert"></div>

    <!--
      FORMULARIO
      novalidate -> desactiva las burbujas nativas del navegador; así mostramos
                    NUESTROS mensajes en rojo debajo de cada campo.
    -->
    <form id="formAbonado" novalidate>

      <!-- ============ SECCIÓN 1: DATOS DEL ABONADO ============ -->
      <section class="card sigea-card mb-4">
        <div class="card-header">
          <span class="sigea-paso">1</span> Datos del abonado
        </div>
        <div class="card-body">
          <!-- row g-3 = fila con separación; col-12 col-md-6 = 1 columna en celular, 2 en PC -->
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="nombres" class="form-label">Nombres <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="nombres" name="nombres"
                     maxlength="80" autocomplete="given-name">
              <!-- Bootstrap muestra .invalid-feedback en rojo cuando el input tiene .is-invalid -->
              <div class="invalid-feedback" id="error-nombres"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="apellidos" class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="apellidos" name="apellidos"
                     maxlength="80" autocomplete="family-name">
              <div class="invalid-feedback" id="error-apellidos"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="dni" class="form-label">DNI <span class="text-danger">*</span></label>
              <!-- inputmode="numeric" abre el teclado numérico en el celular -->
              <input type="text" class="form-control" id="dni" name="dni"
                     inputmode="numeric" maxlength="8" placeholder="12345678">
              <div class="invalid-feedback" id="error-dni"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="celular" class="form-label">Celular <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="celular" name="celular"
                     inputmode="numeric" maxlength="9" placeholder="987654321">
              <div class="invalid-feedback" id="error-celular"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="direccion" name="direccion"
                     maxlength="150" autocomplete="street-address">
              <div class="invalid-feedback" id="error-direccion"></div>
            </div>

          </div>
        </div>
      </section>

      <!-- ============ SECCIÓN 2: VEHÍCULO ============ -->
      <section class="card sigea-card mb-4">
        <div class="card-header">
          <span class="sigea-paso">2</span> Vehículo
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="tipoVehiculo" class="form-label">Tipo de vehículo <span class="text-danger">*</span></label>
              <select class="form-select" id="tipoVehiculo" name="tipoVehiculo">
                <option value="">Seleccione...</option>
                <option value="CARRO">Carro</option>
                <option value="MOTO">Moto</option>
                <option value="CARRETA">Carreta</option>
              </select>
              <div class="invalid-feedback" id="error-tipoVehiculo"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="placa" class="form-label">Placa o código <span class="text-danger">*</span></label>
              <input type="text" class="form-control text-uppercase" id="placa" name="placa"
                     maxlength="15" placeholder="ABC-123">
              <div class="invalid-feedback" id="error-placa"></div>
            </div>

            <div class="col-12">
              <label for="descripcion" class="form-label">Descripción (opcional)</label>
              <input type="text" class="form-control" id="descripcion" name="descripcion"
                     maxlength="100" placeholder="Marca, modelo, color">
            </div>

          </div>
        </div>
      </section>

      <!-- ============ SECCIÓN 3: CONTRATO ============ -->
      <section class="card sigea-card mb-4">
        <div class="card-header">
          <span class="sigea-paso">3</span> Contrato
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="tipoEspacio" class="form-label">Tipo de espacio <span class="text-danger">*</span></label>
              <select class="form-select" id="tipoEspacio" name="tipoEspacio">
                <option value="">Seleccione...</option>
                <option value="TECHADO">Techado</option>
                <option value="EXTERIOR">Exterior</option>
                <option value="ALMACEN">Almacén</option>
              </select>
              <div class="invalid-feedback" id="error-tipoEspacio"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="espacio" class="form-label">Espacio <span class="text-danger">*</span></label>
              <!-- Se llena desde JS solo con espacios LIBRES del tipo elegido (RN-04) -->
              <select class="form-select" id="espacio" name="espacio" disabled>
                <option value="">Primero elija el tipo de espacio</option>
              </select>
              <div class="invalid-feedback" id="error-espacio"></div>
              <div class="form-text" id="ayuda-espacio"></div>
            </div>

            <div class="col-12 col-md-4">
              <label for="tarifa" class="form-label">Tarifa mensual <span class="text-danger">*</span></label>
              <!-- has-validation: necesario para que el mensaje de error se vea dentro de un input-group -->
              <div class="input-group has-validation">
                <span class="input-group-text">S/</span>
                <input type="number" class="form-control" id="tarifa" name="tarifa"
                       min="0.01" step="0.01" inputmode="decimal" placeholder="0.00">
                <div class="invalid-feedback" id="error-tarifa"></div>
              </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4">
              <label for="fechaInicio" class="form-label">Fecha de inicio <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="fechaInicio" name="fechaInicio">
              <div class="invalid-feedback" id="error-fechaInicio"></div>
            </div>

            <div class="col-12 col-sm-6 col-md-4">
              <label for="fechaFin" class="form-label">Fecha de fin <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="fechaFin" name="fechaFin">
              <div class="invalid-feedback" id="error-fechaFin"></div>
            </div>

          </div>
        </div>
      </section>

      <!-- ============ BOTONES ============ -->
      <div class="sigea-acciones">
        <button type="button" class="btn btn-outline-secondary" id="btnLimpiar">
          <i class="bi bi-eraser me-1"></i>Limpiar
        </button>
        <button type="submit" class="btn btn-sigea" id="btnGuardar">
          <span class="spinner-border spinner-border-sm me-1 d-none" id="spinnerGuardar" aria-hidden="true"></span>
          <i class="bi bi-save me-1" id="iconoGuardar"></i>
          <span id="textoGuardar">Guardar abonado</span>
        </button>
      </div>

    </form>
  </main>

  <!-- ============ MODAL DE CONFIRMACIÓN ============ -->
  <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header sigea-modal-header">
          <h2 class="modal-title h5" id="tituloModal">
            <i class="bi bi-check-circle-fill me-2"></i>Abonado registrado
          </h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">El abonado y su contrato se guardaron correctamente.</p>
          <!-- El resumen lo llena JS -->
          <ul class="list-group list-group-flush" id="resumenRegistro"></ul>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sigea" data-bs-dismiss="modal">Registrar otro</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (incluye Popper; necesario para el modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Nuestro script al final del body: el HTML ya existe cuando se ejecuta -->
  <script src="../js/registro-abonado.js"></script>
</body>
</html>
